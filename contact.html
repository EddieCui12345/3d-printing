<html>
<head>
    <title>Contact Us</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            color: #222;
        }

        nav {
            height: 70px;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 50px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        nav a {
            text-decoration: none;
            color: #222;
            margin-left: 30px;
            font-size: 14px;
        }

        .header {
            height: 180px;
            background: #e8e8e8;
        }

        .container {
            width: 90%;
            max-width: 1200px;
            margin: auto;
        }

        .contact {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            margin: 60px 0;
        }

        .info {
            padding: 20px;
        }

        .info-box {
            margin-bottom: 35px;
        }

        .line {
            height: 13px;
            width: 80%;
            background: #ddd;
            margin: 15px 0;
        }

        .map {
            height: 200px;
            background: #e8e8e8;
            margin-top: 30px;
        }

        .form {
            border: 1px solid #ddd;
            padding: 35px;
        }

        input,
        textarea {
            width: 100%;
            border: 1px solid #ccc;
            margin: 10px 0 20px;
            padding: 12px;
        }

        textarea {
            height: 130px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            background: #222;
            color: white;
        }
    </style>
</head>

<body>

<nav>
    <div class="logo"><img src="file:///Users/eddiecui/Desktop/Screenshot%202026-10-04%20at%2012.21.58%E2%80%AFPM.png" alt="Logo" style="height: 60px;"></div>

    <div>
        <a href="home.html">Home</a>
        <a href="products.html">Products</a>
        <a href="story.html">Story</a>
        <a href="about.html">About Us</a>
        <a href="contact.html">Contact Us</a>
    </div>
</nav>

<div class="header"></div>

<div class="container">

    <div class="contact">

        <div class="info">

            <div class="info-box">
                <div class="line"></div>
                <div class="line"></div>
            </div>

            <div class="info-box">
                <div class="line"></div>
                <div class="line"></div>
            </div>

            <div class="info-box">
                <div class="line"></div>
                <div class="line"></div>
            </div>

            <div class="map"></div>

        </div>

        <div class="form">

            <div class="line"></div>

            <input type="text">
            <input type="text">
            <textarea></textarea>

            <button>Lorem Ipsum</button>

        </div>

    </div>

</div>

</body>
</html>
